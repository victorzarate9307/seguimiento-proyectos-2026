<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso - Seguimiento de Proyectos</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #113b5c,
                    #286895
                );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-card {

            width: 100%;
            max-width: 430px;

            background: white;

            border-radius: 16px;

            padding: 35px;

            box-shadow:
                0 18px 50px
                rgba(0,0,0,0.25);
        }

        .logo {

            width: 240px;
            height: 90px;

            display: block;

            margin:
                0 auto
                25px;

            object-fit: contain;

            transform:
                scale(1.5);
        }

        h1 {

            color: #123d60;

            font-size: 25px;

            margin-bottom: 7px;

            text-align: center;
        }

        .subtitulo {

            text-align: center;

            color: #68727d;

            font-size: 13px;

            margin-bottom: 28px;
        }

        .campo {

            margin-bottom: 18px;
        }

        label {

            display: block;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 7px;

            color: #263238;
        }

        input {

            width: 100%;

            height: 45px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            padding:
                0 12px;

            font-size: 14px;
        }

        input:focus {

            outline: none;

            border-color: #21618c;

            box-shadow:
                0 0 0 3px
                rgba(33,97,140,0.12);
        }

        button {

            width: 100%;

            height: 46px;

            border: none;

            border-radius: 7px;

            background: #21618c;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #174d73;
        }

        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }

        #mensaje {

            min-height: 22px;

            margin-top: 17px;

            font-size: 13px;

            text-align: center;
        }

        .error {

            color: #c0392b;
        }

        .correcto {

            color: #198754;
        }

    </style>

</head>


<body>


    <div class="login-card">


        <img
            src="assets/spirax-logo.png"
            alt="Spirax Sarco"
            class="logo"
        >


        <h1>
            Seguimiento de Proyectos
        </h1>


        <p class="subtitulo">
            Acceso al sistema
        </p>


        <form id="formLogin">


            <div class="campo">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                id="btnEntrar"
            >
                Iniciar sesión
            </button>


            <div id="mensaje"></div>


        </form>


    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="login.js"></script>


</body>

</html>
